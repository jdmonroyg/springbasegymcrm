server:
  port: 8080
  servlet:
    context-path: /api/v1
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: main-training-service
  activemq:
    broker-url: tcp://${MQ_HOST:host.docker.internal}:61616
    user: ${MQ_USER:admin}
    password: ${MQ_PASSWORD:admin}
    packages:
      trust-all: true
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
jwt:
  secret: ${JWT_KEY}
