spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:host.docker.internal}:5432/postgres
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data-dev.sql


