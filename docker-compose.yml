services:
#Infrastructure
  mongo-db:
    image: mongo:latest
    container_name: mongo_container
    ports:
      - "27017:27017"
    volumes:
      - mongo-db-data:/data/db
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data

  activemq:
    image: apache/activemq-classic:latest
    container_name: activemq-container
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - activemq-data:/opt/activemq/data

#Microservices
  ms1-producer:
    image: jdmonroyg/workload-producer:1.2
    container_name: ms1-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres-db
      - MQ_HOST=activemq
      - JWT_KEY=this_is_a_secret_super_secure_32_characters
    depends_on:
      - postgres-db
      - activemq

  ms2-consumer:
    image: jdmonroyg/workload-consumer:1.2
    container_name: ms2-container
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/workload
      - MONGO_HOST=mongo-db
      - MQ_HOST=activemq
      - JWT_KEY=this_is_a_secret_super_secure_32_characters
    depends_on:
      - mongo-db
      - activemq

#Volumes
volumes:
  pg-data:
  mongo-db-data:
  activemq-data: